<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dungeon crawler</title>
    <link rel="stylesheet" href="/static/proju.css">
</head>
<body>
    <header>
        <section id="start-screen"></section>
        <h1>Dungeon crawler</h1>
        <h2>Enter Catacombs</h2>
            <p>Choose right doors and fight monsters</p>
            <button id="start-btn">Start a new game</button>
            <button id="load-btn" disabled>Continue saved game</button>
            <p id="start-msg"></p>
        </section>
    </header>
    <main>
        <!-- Start screen -->
            

        <!-- Game screen -->
<section id="game-screen" hidden>
    <div id="stats">
        <p>HP: <span id="hp-text">100</span></p>
        <div id="hp-bar"><div id="hp-fill"></div></div>
        <p>Shield: <span id="shield">0</span></p>
        <p>Floor: <span id="floor">1</span></p>
    </div>

    <div id="boss-hp-bar" hidden>
        <div id="boss-hp-fill"></div>
    </div>

    <canvas id="game" width="800" height="450"></canvas>

    <p id="inventory">Inventory: empty</p>
    <p id="message"></p>

    <div id="log"></div>
    <div id="doors">
        <button id="door-left">Left door</button>
        <button id="door-right">Right door</button>
    </div>
    <button id="save-btn">Save game</button>
    <button id="quit-btn">Quit</button>
</section>
        <!-- End screen -->
        <section id="end-screen" hidden>
            <h2 id="end-title">You beat the game!</h2>
            <button id="restart-btn">Restart</button>
        </section>
    </main>
    <script src="/static/proju.js"></script>
</body>
</html>
